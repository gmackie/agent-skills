name: Catalog
on:
  push:
    branches: ['*']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate catalog and complete workflow collections
        run: |
          python3 tests/verify-workflow-stacks.py
          bash scripts/verify-installable-skills-config.sh
          bash tests/verify-skill-selection.sh
          bash tests/verify-new-public-skills.sh
          bash tests/verify-official-stack-skills.sh
          bash tests/verify-unslop-style.sh
          bash tests/verify-unslop-overlay.sh
          bash tests/verify-unslop-tools.sh
          bash scripts/build-smol-agent-source-config.sh /tmp/smol-agent.reference.json
          cmp catalog/smol-agent.reference.json /tmp/smol-agent.reference.json
          npx --yes skills add . --list
